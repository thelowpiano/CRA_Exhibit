<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Opening Virtual Exhibit</title>
    <!-- Import the Google Model Viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
         .card-description {
            padding: 0 16px 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #555;
        }
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #ffffff;
            position: relative;
        }
        .card-title {
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #222;
            border-top: 1px solid #eee;
        }
        .Hotspot {
                    display: block;
                    width: 10px;
                    height: 10px;
                    border-radius: 10px;
                    border: none;
                    background-color: white;
                    box-sizing: border-box;
                    pointer-events: none;
                  }
        .Hotspot[slot="hotspot-1"] {
                    --min-hotspot-opacity: 0;
                    background-color: white;
                  }
        .HotspotAnnotation {
                    background-color: #f0f0f0;
                    font-color: black;
                    position: absolute;
                    width: 100px;
                    transform: translate(-100px, -75px);
                    border-radius: 10px;
                    padding: 10px;
                  }
        model-viewer > .HotspotAnnotation {
                    transform: translate(10px, 10px);
                  }
        .ar-button,
        .fullscreen-button {
            background-color: white;
            border-radius: 4px;
            border: none;
            position: absolute;
            top: 16px;
            padding: 6px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .ar-button {
            right: 16px;
        }
        .fullscreen-button {
            left: 16px;
        }
       model-viewer.fullscreen-active {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-radius: 0;
        }
        .card.card-fullscreen-active {
            overflow: visible;
        }
        body.no-scroll {
            overflow: hidden;
        }
        .fullscreen-button.exit-mode {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10000;
        }
        .model-viewer-placeholder {
            position: relative;
            width: 100%;
            height: 350px;
            background-color: #eaeaea;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .model-viewer-placeholder img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }
        .model-viewer-placeholder span {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 0.85rem;
            color: #222;
        }
    </style>
</head>
<body>

    <h1>CRA Opening Virtual Exhibit</h1>

    <div class="gallery">

        <!-- Model 1 -->
        <div class="card">
            <model-viewer
                src="Personalized crotalus.glb"
                ar
                camera-controls
                poster="ModelviewerPosterCrotalus.jpeg"
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button class="Hotspot" slot="hotspot-1" data-position="-0.8262652732850384m 0.3185942346296573m 0.04922427926422568m" data-normal="0.9770343919059118m 0.18456705305497714m 0.10648380139554837m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation" style="color: black">Sister Alfride wrote her name here</div>
                </button>
                <button slot="ar-button" class="ar-button" style="color: black">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Personalized Crotalus</div>
            <div class="card-description">This Crotalus, a wooden clapper used to replace bells for Good Friday services was personalized by its owner.</div>
        </div>

        <!-- Model 2 -->
        <div class="card">
            <model-viewer
                src="Apple corer.glb"
                ar
                Poster="ModelViewerPosterAppleCorer.png"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button" style="color: black">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Apple Corer</div>
            <div class="card-description">The sisters of St. Chretienne used this apple core to produce apple sauce from their orchard.</div>
        </div>

        </div>

        <!-- Add more models below by copying a card block and updating src + title -->
        <!--
        <div class="card">
            <model-viewer
                src="Another model.glb"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Another Model</div>
        </div>
        -->

    </div>

<script>
        // Only require a tap-to-load interaction on phones. That's where
        // GPU memory is tight enough that loading multiple full-size
        // models at once can crash the page.
        const isPhone = /Mobi/i.test(navigator.userAgent);
 
        // One entry per card, tracking what's needed to tear down and
        // rebuild that card's <model-viewer> on demand.
        const viewerEntries = [];
 
        function currentViewer(entry) {
            return entry.card.querySelector('model-viewer');
        }
 
        function attachViewerListeners(viewer, entry) {
            viewer.addEventListener('click', () => revealViewer(entry));
            if (isPhone) {
                // When this model is revealed, tear down every other
                // model on the page.
                viewer.addEventListener('poster-dismissed', () => {
                    viewerEntries.forEach((other) => {
                        if (other !== entry) teardownViewer(other);
                    });
                });
            }
        }
 
        // Fully removes the <model-viewer> element (not just its src)
        // and swaps in a lightweight poster placeholder. This matters
        // because clearing src alone frees the loaded model data, but
        // the element's WebGL context stays alive as long as the
        // element itself stays in the DOM — with several models on the
        // page, that's baseline GPU memory that adds up and can still
        // crash the page occasionally, especially when switching
        // between models quickly. Removing the element entirely
        // releases its WebGL context along with everything else.
        function teardownViewer(entry) {
            if (!isPhone) return;
            const viewer = currentViewer(entry);
            if (!viewer) return; // already torn down
 
            const placeholder = document.createElement('div');
            placeholder.className = 'model-viewer-placeholder';
            if (entry.posterSrc) {
                const img = document.createElement('img');
                img.src = entry.posterSrc;
                img.alt = '';
                placeholder.appendChild(img);
            }
            const hint = document.createElement('span');
            hint.textContent = 'Tap to view in 3D';
            placeholder.appendChild(hint);
            placeholder.addEventListener('click', () => revealViewer(entry));
            entry.card.replaceChild(placeholder, viewer);
        }
 
        // Rebuilds the <model-viewer> from its original markup if it was
        // torn down, then reveals it. Returns the live element either way.
        function revealViewer(entry) {
            let viewer = currentViewer(entry);
            if (!viewer) {
                const wrapper = document.createElement('div');
                wrapper.innerHTML = entry.template;
                viewer = wrapper.firstElementChild;
                const placeholder = entry.card.querySelector('.model-viewer-placeholder');
                entry.card.replaceChild(viewer, placeholder);
                attachViewerListeners(viewer, entry);
            }
            if (typeof viewer.dismissPoster === 'function') {
                viewer.dismissPoster();
            }
            return viewer;
        }
 
        document.querySelectorAll('.card').forEach((card) => {
            const viewer = card.querySelector('model-viewer');
            if (isPhone) {
                viewer.setAttribute('reveal', 'interaction');
            }
            const entry = {
                card,
                template: viewer.outerHTML,
                posterSrc: viewer.getAttribute('poster') || '',
            };
            viewerEntries.push(entry);
            attachViewerListeners(viewer, entry);
        });
 
        function enterFullscreen(entry, button) {
            const viewer = revealViewer(entry);
            viewer.classList.add('fullscreen-active');
            entry.card.classList.add('card-fullscreen-active');
            button.classList.add('exit-mode');
            button.textContent = '✕ Exit Fullscreen';
            document.body.classList.add('no-scroll');
        }
 
        function exitFullscreen(entry, button) {
            const viewer = currentViewer(entry);
            if (viewer) viewer.classList.remove('fullscreen-active');
            entry.card.classList.remove('card-fullscreen-active');
            button.classList.remove('exit-mode');
            button.textContent = '⛶ Fullscreen';
            document.body.classList.remove('no-scroll');
        }
 
        document.querySelectorAll('.fullscreen-button').forEach((button) => {
            const card = button.closest('.card');
            const entry = viewerEntries.find((e) => e.card === card);
            button.addEventListener('click', () => {
                const viewer = currentViewer(entry);
                if (viewer && viewer.classList.contains('fullscreen-active')) {
                    exitFullscreen(entry, button);
                } else {
                    enterFullscreen(entry, button);
                }
            });
        });
 
        // Let desktop users press Escape to exit too
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            document.querySelectorAll('model-viewer.fullscreen-active').forEach((viewer) => {
                const card = viewer.closest('.card');
                const entry = viewerEntries.find((e) => e.card === card);
                const button = card.querySelector('.fullscreen-button');
                exitFullscreen(entry, button);
            });
        });
    </script>
 
</body>
</html>
