<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Opening Virtual Exhibit</title>
    <!-- Import the Google Model Viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
         .card-description {
            padding: 0 16px 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #555;
        }
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #ffffff;
            position: relative;
        }
        .card-title {
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #222;
            border-top: 1px solid #eee;
        }
        .hotspot {
                    display: block;
                    width: 20px;
                    height: 20px;
                    border-radius: 10px;
                    border: none;
                    background-color: red;
                    box-sizing: border-box;
                    pointer-events: none;
                  }
        .hotspot[slot="hotspot-1"] {
                    --min-hotspot-opacity: 0;
                    background-color: blue;
                  }
        .annotation {
                    background-color: #888888;
                    position: absolute;
                    transform: translate(10px, 10px);
                    border-radius: 10px;
                    padding: 10px;
                  }
        .ar-button,
        .fullscreen-button {
            background-color: white;
            border-radius: 4px;
            border: none;
            position: absolute;
            top: 16px;
            padding: 6px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .ar-button {
            right: 16px;
        }
        .fullscreen-button {
            left: 16px;
        }
        model-viewer:fullscreen {
            height: 100vh;
            --poster-color: transparent;
        }
    </style>
</head>
<body>

    <h1>CRA Opening Virtual Exhibit</h1>

    <div class="gallery">

        <!-- Model 1 -->
        <div class="card">
            <model-viewer
                src="Personalized crotalus.glb"
                ar
                camera-controls
                poster="poster.webp"
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button class="Hotspot" slot="hotspot-1" data-position="-0.8262652732850384m 0.3185942346296573m 0.04922427926422568m" data-normal="0.9770343919059118m 0.18456705305497714m 0.10648380139554837m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation">Sister Alfride wrote her name here</div>
                </button>
                <button slot="ar-button" class="ar-button">👋 View in AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Personalized Crotalus</div>
            <div class="card-description">This Crotalus, a wooden clapper used to replace bells for Good Friday services was personalized by its owner.,</div>
        </div>

        <!-- Model 2 -->
        <div class="card">
            <model-viewer
                src="Apple corer.glb"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button">👋 View in AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Apple Corer</div>
            <div class="card-description">The sisters of St. Chretienne used this apple core to produce apple sauce from their orchard.</div>
        </div>

        </div>

        <!-- Add more models below by copying a card block and updating src + title -->
        <!--
        <div class="card">
            <model-viewer
                src="Another model.glb"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button">👋 View in AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Another Model</div>
        </div>
        -->

    </div>

    <script>
        document.querySelectorAll('.fullscreen-button').forEach((button) => {
            button.addEventListener('click', () => {
                const viewer = button.closest('.card').querySelector('model-viewer');
                if (viewer.requestFullscreen) {
                    viewer.requestFullscreen();
                } else if (viewer.webkitRequestFullscreen) {
                    viewer.webkitRequestFullscreen(); // Safari/iOS fallback
                }
            });
        });
    </script>

</body>
</html>
