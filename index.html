<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRA Opening Virtual Exhibit</title>
    <!-- Import the Google Model Viewer script -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f0f0f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #222;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
         .card-description {
            padding: 0 16px 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            color: #555;
        }
        model-viewer {
            width: 100%;
            height: 350px;
            background-color: #ffffff;
            position: relative;
        }
        .card-title {
            padding: 14px 16px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #222;
            border-top: 1px solid #eee;
        }
        .Hotspot {
                    display: block;
                    width: 10px;
                    height: 10px;
                    border-radius: 10px;
                    border: none;
                    background-color: white;
                    box-sizing: border-box;
                    pointer-events: none;
                  }
        .Hotspot[slot="hotspot-1"] {
                    --min-hotspot-opacity: 0;
                    background-color: white;
                  }
        .HotspotAnnotation {
                    background-color: #888888;
                    font-color: black;
                    position: absolute;
                    width: 100px;
                    transform: translate(-100px, -75px);
                    border-radius: 10px;
                    padding: 10px;
                  }
        model-viewer > .HotspotAnnotation {
                    transform: translate(10px, 10px);
                  }
        .ar-button,
        .fullscreen-button {
            background-color: white;
            border-radius: 4px;
            border: none;
            position: absolute;
            top: 16px;
            padding: 6px 10px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .ar-button {
            right: 16px;
        }
        .fullscreen-button {
            left: 16px;
        }
       model-viewer.fullscreen-active {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 9999;
            border-radius: 0;
        }
        .card.card-fullscreen-active {
            overflow: visible;
        }
    </style>
</head>
<body>

    <h1>CRA Opening Virtual Exhibit</h1>

    <div class="gallery">

        <!-- Model 1 -->
        <div class="card">
            <model-viewer
                src="Personalized crotalus.glb"
                ar
                camera-controls
                poster="ModelviewerPosterCrotalus.png"
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button class="Hotspot" slot="hotspot-1" data-position="-0.8262652732850384m 0.3185942346296573m 0.04922427926422568m" data-normal="0.9770343919059118m 0.18456705305497714m 0.10648380139554837m" data-visibility-attribute="visible">
                    <div class="HotspotAnnotation">Sister Alfride wrote her name here</div>
                </button>
                <button slot="ar-button" class="ar-button">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Personalized Crotalus</div>
            <div class="card-description">This Crotalus, a wooden clapper used to replace bells for Good Friday services was personalized by its owner.</div>
        </div>

        <!-- Model 2 -->
        <div class="card">
            <model-viewer
                src="Apple corer.glb"
                ar
                Poster="ModelViewerPosterAppleCorer.png"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Apple Corer</div>
            <div class="card-description">The sisters of St. Chretienne used this apple core to produce apple sauce from their orchard.</div>
        </div>

        </div>

        <!-- Add more models below by copying a card block and updating src + title -->
        <!--
        <div class="card">
            <model-viewer
                src="Another model.glb"
                ar
                ar-modes="webxr scene-viewer quick-look"
                camera-controls
                shadow-intensity="1"
                environment-image="neutral"
                auto-rotate>
                <button slot="ar-button" class="ar-button">👋 View in VR or AR</button>
            </model-viewer>
            <button class="fullscreen-button">⛶ Fullscreen</button>
            <div class="card-title">Another Model</div>
        </div>
        -->

    </div>

   <script>
        const isPhone = /Mobi/i.test(navigator.userAgent);
        if (isPhone) {
            document.querySelectorAll('model-viewer').forEach((viewer) => {
                viewer.setAttribute('reveal', 'interaction');
            });
        }
       
        function enterFullscreen(card, viewer, button) {
            viewer.classList.add('fullscreen-active');
            card.classList.add('card-fullscreen-active');
            button.classList.add('exit-mode');
            button.textContent = '✕ Exit Fullscreen';
            document.body.classList.add('no-scroll');
        }
 
        function exitFullscreen(card, viewer, button) {
            viewer.classList.remove('fullscreen-active');
            card.classList.remove('card-fullscreen-active');
            button.classList.remove('exit-mode');
            button.textContent = '⛶ Fullscreen';
            document.body.classList.remove('no-scroll');
        }
 
        document.querySelectorAll('.fullscreen-button').forEach((button) => {
            button.addEventListener('click', () => {
                const card = button.closest('.card');
                const viewer = card.querySelector('model-viewer');
                if (viewer.classList.contains('fullscreen-active')) {
                    exitFullscreen(card, viewer, button);
                } else {
                    enterFullscreen(card, viewer, button);
                }
            });
        });
 
        // Let desktop users press Escape to exit too
        document.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            document.querySelectorAll('model-viewer.fullscreen-active').forEach((viewer) => {
                const card = viewer.closest('.card');
                const button = card.querySelector('.fullscreen-button');
                exitFullscreen(card, viewer, button);
            });
        });
    </script>
    </script>

</body>
</html>
